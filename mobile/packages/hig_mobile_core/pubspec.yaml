name: hig_mobile_core
description: Secure API, offline sync, push registration, and shared UI for Hig School mobile apps.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  razorpay_flutter: ^1.4.0
  url_launcher: ^6.3.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/school-campus.png
