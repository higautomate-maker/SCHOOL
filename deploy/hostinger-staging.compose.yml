name: staging-school

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    image: hig-school-staging-app:${STAGING_IMAGE_TAG:-local}
    env_file:
      - ../.env.staging
    ports:
      - "127.0.0.1:${STAGING_HOST_PORT:-3100}:3000"
    volumes:
      - staging_school_data:/data/staging-school
      - staging_school_logs:/logs/staging-school
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.staging-school.entrypoints: websecure
      traefik.http.routers.staging-school.rule: Host(`staging-school.higaai.com`)
      traefik.http.routers.staging-school.service: staging-school
      traefik.http.routers.staging-school.tls: "true"
      traefik.http.routers.staging-school.tls.certresolver: letsencrypt
      traefik.http.services.staging-school.loadbalancer.server.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 9
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: notification-worker
    image: hig-school-staging-worker:${STAGING_IMAGE_TAG:-local}
    env_file:
      - ../.env.staging
    environment:
      HIG_QUEUE_WORKER_ENABLED: "true"
      HIG_QUEUE_HEARTBEAT_PATH: /logs/staging-school/notification-worker-heartbeat.json
    volumes:
      - staging_school_logs:/logs/staging-school
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - npm
        - run
        - stage8:worker:health
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  operator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: staging-operator
    image: hig-school-staging-operator:${STAGING_IMAGE_TAG:-local}
    env_file:
      - ../.env.staging
      - ../.env.staging.operator
    volumes:
      - staging_school_backups:/backups/staging-school
    profiles:
      - operator

volumes:
  staging_school_data:
    name: staging_school_data
  staging_school_logs:
    name: staging_school_logs
  staging_school_backups:
    name: staging_school_backups
