services:
  hig-school:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hig-school
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HIG_RUNTIME: node
      HIG_DEMO_DB_PATH: /data/hig-school-demo.sqlite
      HIG_SQLITE_MIGRATIONS_PATH: /app/drizzle
    ports:
      - "3000:3000"
    volumes:
      - hig-school-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

volumes:
  hig-school-data:
