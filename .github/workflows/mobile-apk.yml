name: Mobile Flutter CI

# Runs analysis, tests and UNSIGNED debug APK builds for the three Flutter apps
# on pull requests that touch mobile code. No signing keys, store credentials,
# production secrets or release publishing are used. Debug APKs are uploaded
# only as short-lived CI artifacts for reviewer download.

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch: {}

# Never expose repository/organization secrets to this workflow.
permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: ${{ matrix.app }} (analyze • test • debug apk)
    runs-on: ubuntu-latest # Linux x86_64
    strategy:
      fail-fast: false
      matrix:
        app:
          - staff_admin_app
          - student_parent_app
          - driver_gps_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter (with pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (shared core + app)
        run: |
          flutter pub get -C mobile/packages/hig_mobile_core
          flutter pub get -C mobile/${{ matrix.app }}

      - name: Static analysis
        run: flutter analyze
        working-directory: mobile/${{ matrix.app }}

      - name: Unit / widget tests (if present)
        working-directory: mobile/${{ matrix.app }}
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory for ${{ matrix.app }} — skipping."
          fi

      - name: Build unsigned debug APK
        working-directory: mobile/${{ matrix.app }}
        run: flutter build apk --debug

      - name: Upload debug APK artifact (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 5
